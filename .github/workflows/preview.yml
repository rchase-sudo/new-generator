name: Build preview page

on:
  workflow_dispatch:
    inputs:
      job_ids: {description: "Job id(s), comma separated", required: true}
      force: {description: "Build even when residual land value is under the asking price (true/false)", required: false, default: "false"}

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
      CRM_SERVICE_ROLE_KEY: ${{ secrets.CRM_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-liberation fonts-crosextra-carlito || true
      - run: pip install -r requirements.txt
      - run: python scripts/preview.py "${{ inputs.job_ids }}" $([ "${{ inputs.force }}" = "true" ] && echo --force)
